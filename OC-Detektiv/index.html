<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>OC Snapshot Game</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #0f0f1a;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
  }

  h1 {
    margin-bottom: 20px;
  }

  #card {
    width: 70%;
    max-width: 600px;
    padding: 20px;
    background: #1c1c2e;
    border-radius: 15px;
    font-size: 18px;
    text-align: center;
    min-height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  button {
    margin-top: 20px;
    padding: 12px 20px;
    font-size: 16px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    background: #6c5ce7;
    color: white;
  }

  button:hover {
    background: #5a4bd6;
  }

  #imageOverlay{
    position:fixed;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.9);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:999;
    cursor:pointer;
}

#fullscreenImage{
    max-width:95%;
    max-height:95%;
    border-radius:10px;
}
</style>
</head>

<body>

<h1>OC Snapshot Generator</h1>

<div id="card">Drücke den Button für eine Snapshot-Karte</div>

<button onclick="openImage()">Bild anzeigen</button>
<div id="imageOverlay" onclick="closeImage()">
    <img src="OCs.jpg" id="fullscreenImage">
</div>


<button onclick="drawCard()">Ziehe Karte</button>

function drawCard() {
  const randomIndex = Math.floor(Math.random() * cards.length);
  document.getElementById("card").innerText = cards[randomIndex];

function openImage() {
  document.getElementById("imageOverlay").style.display = "flex";
}

function closeImage() {
  document.getElementById("imageOverlay").style.display = "none";
