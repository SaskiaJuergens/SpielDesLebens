let recentCards = [];
const MAX_RECENT = 40;

function drawCard() {
    let randomIndex;

    // So lange neue Karte suchen, bis sie nicht unter den letzten 15 ist
    do {
        randomIndex = Math.floor(Math.random() * cards.length);
    } while (recentCards.includes(randomIndex) && recentCards.length < cards.length);

    // Karte anzeigen
    document.getElementById("card").innerText = cards[randomIndex];

    // Karte zu den zuletzt gezogenen hinzufügen
    recentCards.push(randomIndex);

    // Wenn mehr als 15 gespeichert sind, älteste entfernen
    if (recentCards.length > MAX_RECENT) {
        recentCards.shift();
    }
}

function openImage() {

function closeImage() {
  document.getElementById("imageOverlay").style.display = "none";
